[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    integration_stt: needs the real Whisper model files (cached or downloadable). Run with RUN_STT_INTEGRATION=1
    integration_tts: needs FISH_API_KEY and network. Run with RUN_TTS_INTEGRATION=1
    integration_llm: needs OPENROUTER_API_KEY and network. Run with RUN_LLM_INTEGRATION=1
